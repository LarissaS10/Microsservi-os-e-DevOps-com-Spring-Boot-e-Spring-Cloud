services:
  postgres-alunos-v2:
    image: postgres:latest
    container_name: postgres-alunos-v2
    restart: always
    environment:
      POSTGRES_USER: teste
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: aluno_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql

  mongo-cursos:
    image: mongo:latest
    container_name: mongo-cursos
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: teste
      MONGO_INITDB_ROOT_PASSWORD: teste
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data_v2:
  mongo_data: